name: K1 Fab Pack

on:
  push: { branches: ["**"] }
  pull_request: {}
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y kicad
      - name: Install KiBot
        run: |
          pipx install kibot
      - name: Generate Fab Artifacts from Committed Netlist
        working-directory: hardware/k1-lightwave
        run: |
          mkdir -p _artifacts
          # Use pre-generated netlist (k1_motherboard_revA.net) with KiBot
          # KiBot will generate Gerbers, STEP, iBOM from the design
          kibot -c kibot.yaml -d _artifacts -e kicad/K1_Lightwave.kicad_sch -b kicad/K1_Lightwave.kicad_pcb -v
          echo "✅ Fab artifacts generated successfully"
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fab-artifacts
          path: hardware/k1-lightwave/_artifacts/

name: KiBot CI - PCB Artifact Generation

on:
  push:
    branches:
      - main
      - develop
      - feat/**
    paths:
      - 'hardware/k1-lightwave/kicad/**'
      - 'hardware/k1-lightwave/kibot.yaml'
      - '.github/workflows/kibot.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'hardware/k1-lightwave/kicad/**'
      - 'hardware/k1-lightwave/kibot.yaml'
  workflow_dispatch:

jobs:
  kibot:
    runs-on: ubuntu-latest
    container:
      image: setsoft/kicad_auto:latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show environment
        run: |
          echo "Python: $(python3 --version)"
          echo "KiCad: $(kicad --version 2>/dev/null || echo 'Not in PATH')"
          which kibot || echo "KiBot not yet installed"

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            python3-pip \
            libssl-dev \
            libffi-dev \
            xvfb \
            imagemagick \
            ghostscript
          pip3 install --upgrade pip
          pip3 install kibot

      - name: Verify KiCad files exist
        run: |
          ls -la hardware/k1-lightwave/kicad/
          file hardware/k1-lightwave/kicad/*.kicad_sch
          file hardware/k1-lightwave/kicad/*.kicad_pcb

      - name: Run KiBot - ERC/DRC/Artifacts
        working-directory: hardware/k1-lightwave
        run: |
          kibot \
            -c kibot.yaml \
            -e kicad/K1_Lightwave.kicad_sch \
            -b kicad/K1_Lightwave.kicad_pcb \
            -d build/ \
            --verbose

      - name: Generate summary
        if: always()
        run: |
          echo "## KiBot Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Build completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -d "hardware/k1-lightwave/build" ]; then
            echo "### Generated Artifacts:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            find hardware/k1-lightwave/build -type f | head -20 | while read file; do
              echo "- \`$(basename $file)\`" >> $GITHUB_STEP_SUMMARY
            done
          fi

      - name: Check ERC report
        if: always()
        run: |
          if [ -f "hardware/k1-lightwave/build/erc/K1_Lightwave_ERC_Report.txt" ]; then
            echo "=== ERC Report ==="
            cat hardware/k1-lightwave/build/erc/K1_Lightwave_ERC_Report.txt
          else
            echo "ERC report not generated (schematic skeleton only)"
          fi

      - name: Check DRC report
        if: always()
        run: |
          if [ -f "hardware/k1-lightwave/build/drc/K1_Lightwave_DRC_Report.txt" ]; then
            echo "=== DRC Report ==="
            cat hardware/k1-lightwave/build/drc/K1_Lightwave_DRC_Report.txt
          else
            echo "DRC report not generated (layout skeleton only)"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kibot-artifacts-${{ github.run_number }}
          path: hardware/k1-lightwave/build/
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'hardware/k1-lightwave/build';

            let comment = '## 🤖 KiBot Build Artifacts\n\n';

            if (fs.existsSync(path)) {
              const files = [];
              const walk = (dir) => {
                fs.readdirSync(dir, { withFileTypes: true }).forEach(file => {
                  const fullPath = `${dir}/${file.name}`;
                  if (file.isFile()) files.push(fullPath);
                  else if (file.isDirectory()) walk(fullPath);
                });
              };
              walk(path);

              if (files.length > 0) {
                comment += '### Generated Files:\n';
                files.slice(0, 20).forEach(file => {
                  const size = fs.statSync(file).size;
                  const sizeKB = (size / 1024).toFixed(1);
                  comment += `- ${file.replace(path + '/', '')} (${sizeKB} KB)\n`;
                });
              }
            } else {
              comment += 'No artifacts generated (skeleton files only)\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  validate:
    runs-on: ubuntu-latest
    needs: kibot
    if: always()

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: kibot-artifacts-${{ github.run_number }}

      - name: Validate Gerbers (basic)
        run: |
          echo "Checking for essential Gerber layers..."
          ls -la gerbers/ 2>/dev/null || echo "Gerbers not yet generated"

      - name: Check IPC-2581
        run: |
          echo "Checking for IPC-2581 specification..."
          ls -la ipc2581/ 2>/dev/null || echo "IPC-2581 not yet generated"

      - name: Final summary
        run: |
          echo "✅ KiBot CI pipeline completed"
          echo "Build artifacts available for download"

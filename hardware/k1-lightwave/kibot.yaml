project:
  outputs_dir: _artifacts

filters:
  - name: all
    comment: Include everything

outputs:
  - name: gerbers
    type: gerber
    dir: fab/gerbers
  - name: drill
    type: drill
    dir: fab/drill
  - name: step
    type: step
    dir: mechanical
    options: { board_thickness: 1.6 }
  - name: glb
    type: glb
    dir: mechanical
  - name: ibom
    type: ibom
    dir: docs/ibom
    options:
      extra_fields: ["LCSC","MPN","Manufacturer"]
      no_browser: true
